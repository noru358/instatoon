name: pipeline-contract

on:
  push:
    branches: ["main"]
    paths:
      - "pipeline/**"
      - "schemas/**"
      - "assets/production/**"
      - "assets/style_refs/v2_current/**"
      - "*.md"
      - ".github/workflows/pipeline-contract.yml"
  pull_request:
    paths:
      - "pipeline/**"
      - "schemas/**"
      - "assets/production/**"
      - "*.md"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile retained project helper
        run: python -m py_compile pipeline/reference_registry.py
      - name: Current authoring reference registry matches binaries
        run: python pipeline/reference_registry.py
      - name: Production registry is valid JSON
        run: python -m json.tool assets/production/registry.json >/dev/null
