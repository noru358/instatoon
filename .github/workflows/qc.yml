name: qc

# Manual only. Records a human PASS/FAIL for a slide that is already rendered,
# and advances PRODUCTION_STATE.current_stage accordingly.
# The verdict is bound to the SHA-256 of the actual image and to the attempt
# that produced it, so it goes stale by itself if the slide is rendered again.
on:
  workflow_dispatch:
    inputs:
      slide:
        description: "Slide number you just looked at"
        required: true
        default: "1"
      verdict:
        description: "PASS or FAIL"
        required: true
        type: choice
        options: ["PASS", "FAIL"]
        default: "PASS"
      note:
        description: "Optional short reason, especially for FAIL"
        required: false
        default: ""
      episode:
        description: "Episode ID. Leave empty to use the active episode"
        required: false
        default: ""

# Same lock as render.yml because both commands mutate the same episode state.
concurrency:
  group: instatoon-production
  cancel-in-progress: false

jobs:
  record-verdict:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve episode
        id: ep
        env:
          EPISODE: ${{ inputs.episode }}
        run: |
          if [ -n "$EPISODE" ]; then
            EID=$(python pipeline/render.py resolve --episode "$EPISODE")
          else
            EID=$(python pipeline/render.py resolve)
          fi
          echo "id=$EID" >> "$GITHUB_OUTPUT"
          echo "resolved episode: $EID"

      - name: Record verdict
        env:
          SLIDE: ${{ inputs.slide }}
          VERDICT: ${{ inputs.verdict }}
          NOTE: ${{ inputs.note }}
          EPISODE: ${{ steps.ep.outputs.id }}
        run: |
          python pipeline/render.py qc \
            --slide "$SLIDE" --verdict "$VERDICT" --note "$NOTE" --episode "$EPISODE"

      - name: Commit the verdict
        env:
          EID: ${{ steps.ep.outputs.id }}
          SLIDE: ${{ inputs.slide }}
          VERDICT: ${{ inputs.verdict }}
        run: |
          set -euo pipefail
          git config user.name "instatoon-render"
          git config user.email "render@users.noreply.github.com"
          printf -v SLIDE_PAD '%02d' "$SLIDE"

          # QC must describe the exact artifact/state inspected by this run. If
          # either changed remotely while the workflow was running, discard it.
          assert_qc_inputs_unchanged() {
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git diff --quiet "$GITHUB_SHA" "origin/${GITHUB_REF_NAME}" -- \
              CURRENT_STATE.md \
              pipeline/render_guard.py \
              pipeline/render.py \
              "episodes/$EID/EPISODE_PLAN.json" \
              "episodes/$EID/RENDER_MANIFEST.json" \
              "episodes/$EID/PRODUCTION_STATE.json" \
              "episodes/$EID/renders/slide_${SLIDE_PAD}_art.png" \
              "episodes/$EID/renders/attempts"; then
              echo "::error::QC inputs changed on origin while this run was in flight; discarding stale verdict"
              exit 2
            fi
          }

          assert_qc_inputs_unchanged
          git add "episodes/$EID/PRODUCTION_STATE.json"
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          printf -v MSG 'qc: %s slide_%02d %s' "$EID" "$SLIDE" "$VERDICT"
          git commit -m "$MSG"

          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected; checking for stale QC inputs before rebase (attempt $attempt)"
            assert_qc_inputs_unchanged
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 1
          done
          echo "could not push after 3 attempts" >&2
          exit 1
