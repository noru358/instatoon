name: qc

# Human QC remains authoritative for the episode anchor. After a human PASS on
# slide 1, finish_mode=auto_finish may continue the remaining production
# internally. finish_mode=standard preserves the original manual path.
on:
  workflow_dispatch:
    inputs:
      slide:
        description: "Slide number you just looked at"
        required: true
        default: "1"
      verdict:
        description: "PASS or FAIL"
        required: true
        type: choice
        options: ["PASS", "FAIL"]
        default: "PASS"
      note:
        description: "Optional short reason, especially for FAIL"
        required: false
        default: ""
      finish_mode:
        description: "After human PASS on slide 1"
        required: true
        type: choice
        options: ["auto_finish", "standard"]
        default: "auto_finish"
      episode:
        description: "Episode ID. Leave empty to use the active episode"
        required: false
        default: ""

# Render, human QC, and auto-finish mutate the same episode state/artifacts.
concurrency:
  group: instatoon-production
  cancel-in-progress: false

jobs:
  record-verdict:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet openai pillow pydantic

      - name: Install Korean font for deterministic lettering
        if: ${{ inputs.finish_mode == 'auto_finish' && inputs.slide == '1' && inputs.verdict == 'PASS' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum

      - name: Resolve episode
        id: ep
        env:
          EPISODE: ${{ inputs.episode }}
        run: |
          if [ -n "$EPISODE" ]; then
            EID=$(python pipeline/render.py resolve --episode "$EPISODE")
          else
            EID=$(python pipeline/render.py resolve)
          fi
          echo "id=$EID" >> "$GITHUB_OUTPUT"
          echo "resolved episode: $EID"

      - name: Record human verdict
        env:
          SLIDE: ${{ inputs.slide }}
          VERDICT: ${{ inputs.verdict }}
          NOTE: ${{ inputs.note }}
          EPISODE: ${{ steps.ep.outputs.id }}
        run: |
          python pipeline/render.py qc \
            --slide "$SLIDE" --verdict "$VERDICT" --note "$NOTE" --episode "$EPISODE"

      - name: Auto-finish after approved anchor
        if: ${{ inputs.finish_mode == 'auto_finish' && inputs.slide == '1' && inputs.verdict == 'PASS' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EPISODE: ${{ steps.ep.outputs.id }}
        run: python pipeline/auto_finish.py run --episode "$EPISODE"

      - name: Show episode status
        env:
          EID: ${{ steps.ep.outputs.id }}
        run: |
          python pipeline/render.py status --episode "$EID"
          python pipeline/auto_finish.py status --episode "$EID"

      - name: Commit QC / auto-finish result
        env:
          EID: ${{ steps.ep.outputs.id }}
          SLIDE: ${{ inputs.slide }}
          VERDICT: ${{ inputs.verdict }}
          FINISH_MODE: ${{ inputs.finish_mode }}
        run: |
          set -euo pipefail
          git config user.name "instatoon-render"
          git config user.email "render@users.noreply.github.com"
          printf -v SLIDE_PAD '%02d' "$SLIDE"

          # A human verdict and every auto-finish artifact are valid only for the
          # exact authority snapshot checked out by this run. Never rebase them
          # onto changed prompts/plans/references/state.
          assert_production_inputs_unchanged() {
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git diff --quiet "$GITHUB_SHA" "origin/${GITHUB_REF_NAME}" -- \
              CURRENT_STATE.md \
              MASTER_PROMPTS.md \
              GENERATION_PROTOCOL.md \
              AUTOMATION_TRANSITION.md \
              pipeline/render_guard.py \
              pipeline/render.py \
              pipeline/auto_finish.py \
              pipeline/lettering.py \
              schemas/lettering_plan.schema.json \
              "episodes/$EID/EPISODE_PLAN.json" \
              "episodes/$EID/RENDER_MANIFEST.json" \
              "episodes/$EID/LETTERING_PLAN.json" \
              "episodes/$EID/PRODUCTION_STATE.json" \
              assets/style_refs/v2_current; then
              echo "::error::production inputs changed on origin while this run was in flight; discarding stale QC/auto-finish output"
              exit 2
            fi
          }

          assert_production_inputs_unchanged

          git add "episodes/$EID/PRODUCTION_STATE.json"
          for path in \
            "episodes/$EID/renders" \
            "episodes/$EID/qc" \
            "episodes/$EID/lettering" \
            "episodes/$EID/exports"; do
            if [ -e "$path" ]; then
              git add -A "$path"
            fi
          done

          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi

          if [ "$FINISH_MODE" = "auto_finish" ] && [ "$SLIDE" = "1" ] && [ "$VERDICT" = "PASS" ]; then
            MSG="auto-finish: $EID from approved anchor"
          else
            printf -v MSG 'qc: %s slide_%02d %s' "$EID" "$SLIDE" "$VERDICT"
          fi
          git commit -m "$MSG"

          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected; checking for stale production inputs before rebase (attempt $attempt)"
            assert_production_inputs_unchanged
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 1
          done
          echo "could not push after 3 attempts" >&2
          exit 1
