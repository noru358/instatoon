name: qc

# MANUAL_VALIDATION approval topology:
# content/storyboard approval -> S01 USER anchor PASS -> S02..final OPERATOR_INTERNAL QC
# -> COMPLETE raster-set USER gate -> lettering/final.
# One slide = one file, but one slide != one user-approval gate.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "frame = one artifact QC; raster_set = user verdict on complete text-free set"
        required: true
        type: choice
        options: ["frame", "raster_set"]
        default: "frame"
      slide:
        description: "Frame scope only: slide number"
        required: false
        default: "1"
      verdict:
        description: "PASS or FAIL"
        required: true
        type: choice
        options: ["PASS", "FAIL"]
        default: "PASS"
      inspection_kind:
        description: "Frame scope only. S01 PASS must be user; S02+ normally operator_internal."
        required: true
        type: choice
        options: ["operator_internal", "user"]
        default: "operator_internal"
      note:
        description: "Optional reason/evidence"
        required: false
        default: ""
      finish_mode:
        description: "S01 USER PASS only: standard keeps manual gates; auto_finish bypasses later human gates"
        required: true
        type: choice
        options: ["standard", "auto_finish"]
        default: "standard"
      episode:
        description: "Episode ID. Leave empty to use the active episode"
        required: false
        default: ""

concurrency:
  group: instatoon-production
  cancel-in-progress: false

jobs:
  record-verdict:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet openai pillow pydantic

      - name: Install Korean font for auto-finish
        if: ${{ inputs.scope == 'frame' && inputs.finish_mode == 'auto_finish' && inputs.slide == '1' && inputs.verdict == 'PASS' && inputs.inspection_kind == 'user' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum

      - name: Resolve episode
        id: ep
        env:
          EPISODE: ${{ inputs.episode }}
        run: |
          if [ -n "$EPISODE" ]; then
            EID=$(python pipeline/render.py resolve --episode "$EPISODE")
          else
            EID=$(python pipeline/render.py resolve)
          fi
          echo "id=$EID" >> "$GITHUB_OUTPUT"
          echo "resolved episode: $EID"

      - name: Record frame verdict
        if: ${{ inputs.scope == 'frame' }}
        env:
          SLIDE: ${{ inputs.slide }}
          VERDICT: ${{ inputs.verdict }}
          NOTE: ${{ inputs.note }}
          INSPECTION_KIND: ${{ inputs.inspection_kind }}
          EPISODE: ${{ steps.ep.outputs.id }}
        run: |
          if [ "$INSPECTION_KIND" = "user" ]; then INSPECTOR=USER; else INSPECTOR=OPERATOR_INTERNAL; fi
          python pipeline/render.py qc             --slide "$SLIDE" --verdict "$VERDICT" --note "$NOTE"             --inspector "$INSPECTOR" --episode "$EPISODE"

      - name: Record complete raster-set user verdict
        if: ${{ inputs.scope == 'raster_set' }}
        env:
          VERDICT: ${{ inputs.verdict }}
          NOTE: ${{ inputs.note }}
          EPISODE: ${{ steps.ep.outputs.id }}
        run: |
          python pipeline/render.py raster-set-qc             --verdict "$VERDICT" --note "$NOTE" --episode "$EPISODE"

      - name: Auto-finish after approved S01 anchor
        if: ${{ inputs.scope == 'frame' && inputs.finish_mode == 'auto_finish' && inputs.slide == '1' && inputs.verdict == 'PASS' && inputs.inspection_kind == 'user' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EPISODE: ${{ steps.ep.outputs.id }}
        run: python -m pipeline.auto_finish run --episode "$EPISODE"

      - name: Show episode status
        env:
          EID: ${{ steps.ep.outputs.id }}
        run: |
          python pipeline/render.py status --episode "$EID"
          python -m pipeline.auto_finish status --episode "$EID"

      - name: Commit QC / auto-finish result
        env:
          EID: ${{ steps.ep.outputs.id }}
          SLIDE: ${{ inputs.slide }}
          VERDICT: ${{ inputs.verdict }}
          FINISH_MODE: ${{ inputs.finish_mode }}
          SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          git config user.name "instatoon-render"
          git config user.email "render@users.noreply.github.com"

          assert_production_inputs_unchanged() {
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git diff --quiet "$GITHUB_SHA" "origin/${GITHUB_REF_NAME}" --               CURRENT_STATE.md               MASTER_PROMPTS.md               GENERATION_PROTOCOL.md               AUTOMATION_TRANSITION.md               pipeline/render_guard.py               pipeline/render.py               pipeline/auto_finish.py               pipeline/lettering.py               schemas/production_state.schema.json               schemas/lettering_plan.schema.json               "episodes/$EID/EPISODE_PLAN.json"               "episodes/$EID/RENDER_MANIFEST.json"               "episodes/$EID/LETTERING_PLAN.json"               "episodes/$EID/PRODUCTION_STATE.json"               assets/style_refs/v2_current; then
              echo "::error::production inputs changed on origin while this run was in flight; discarding stale QC/auto-finish output"
              exit 2
            fi
          }

          assert_production_inputs_unchanged
          git add "episodes/$EID/PRODUCTION_STATE.json"
          for path in "episodes/$EID/renders" "episodes/$EID/qc" "episodes/$EID/lettering" "episodes/$EID/exports"; do
            if [ -e "$path" ]; then git add -A "$path"; fi
          done
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi

          if [ "$SCOPE" = "raster_set" ]; then
            MSG="qc: $EID raster-set $VERDICT"
          elif [ "$FINISH_MODE" = "auto_finish" ] && [ "$SLIDE" = "1" ] && [ "$VERDICT" = "PASS" ]; then
            MSG="auto-finish: $EID from approved anchor"
          else
            printf -v MSG 'qc: %s slide_%02d %s' "$EID" "$SLIDE" "$VERDICT"
          fi
          git commit -m "$MSG"

          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected; checking for stale production inputs before rebase (attempt $attempt)"
            assert_production_inputs_unchanged
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 1
          done
          echo "could not push after 3 attempts" >&2
          exit 1
