name: render

# Manual only. Actions tab -> render -> Run workflow.
# This is the only sanctioned production image path.
on:
  workflow_dispatch:
    inputs:
      slide:
        description: "Slide number to render (1, 2, 3 ...)"
        required: true
        default: "1"
      episode:
        description: "Episode ID. Leave empty to use the active episode in CURRENT_STATE.md"
        required: false
        default: ""
      dry_run:
        description: "Run every gate and print the media binding without calling the image model"
        type: boolean
        default: false

# Render and QC mutate the same production state. Serialize the whole production
# control plane for now; per-episode parallelism can come later if it is needed.
concurrency:
  group: instatoon-production
  cancel-in-progress: false

jobs:
  render-slide:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet openai pillow

      - name: Validate render contract
        run: python pipeline/render_guard.py validate

      - name: Resolve episode
        id: ep
        env:
          EPISODE: ${{ inputs.episode }}
        run: |
          if [ -n "$EPISODE" ]; then
            EID=$(python pipeline/render.py resolve --episode "$EPISODE")
          else
            EID=$(python pipeline/render.py resolve)
          fi
          echo "id=$EID" >> "$GITHUB_OUTPUT"
          echo "resolved episode: $EID"

      - name: Render slide
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SLIDE: ${{ inputs.slide }}
          EPISODE: ${{ steps.ep.outputs.id }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python pipeline/render.py render --slide "$SLIDE" --episode "$EPISODE" --dry-run
          else
            python pipeline/render.py render --slide "$SLIDE" --episode "$EPISODE"
          fi

      - name: Show episode status
        if: ${{ inputs.dry_run != true }}
        run: python pipeline/render.py status --episode "${{ steps.ep.outputs.id }}"

      - name: Commit the rendered frame
        if: ${{ inputs.dry_run != true }}
        env:
          EID: ${{ steps.ep.outputs.id }}
          SLIDE: ${{ inputs.slide }}
        run: |
          set -euo pipefail
          git config user.name "instatoon-render"
          git config user.email "render@users.noreply.github.com"

          # A provider call can take long enough for another actor (for example the
          # GPT app) to update the branch. Never place a render made from old inputs
          # on top of a newer contract. Unrelated remote commits may still be rebased.
          assert_render_inputs_unchanged() {
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git diff --quiet "$GITHUB_SHA" "origin/${GITHUB_REF_NAME}" -- \
              CURRENT_STATE.md \
              MASTER_PROMPTS.md \
              pipeline/render_guard.py \
              pipeline/render.py \
              "episodes/$EID/EPISODE_PLAN.json" \
              "episodes/$EID/RENDER_MANIFEST.json" \
              "episodes/$EID/PRODUCTION_STATE.json" \
              assets/style_refs/v2_current; then
              echo "::error::render inputs changed on origin while this run was in flight; discarding stale output"
              exit 2
            fi
          }

          assert_render_inputs_unchanged
          git add "episodes/$EID/renders" "episodes/$EID/PRODUCTION_STATE.json"
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          printf -v MSG 'render: %s slide_%02d' "$EID" "$SLIDE"
          git commit -m "$MSG"

          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected; checking for stale render inputs before rebase (attempt $attempt)"
            assert_render_inputs_unchanged
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 1
          done
          echo "could not push after 3 attempts" >&2
          exit 1
